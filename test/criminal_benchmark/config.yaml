# 刑事案件 RAG Benchmark 测试配置

server:
  base_url: "http://127.0.0.1:9380"
  api_version: "v1"

auth:
  email: "qa@infiniflow.org"
  # password 是 "123" 加密后的值
  password: ""

dataset:
  name_prefix: "criminal_benchmark"
  embedding_model: "embedding-3@ZHIPU-AI"
  chunk_method: "naive"

chat:
  llm_model: "glm-4-flash@ZHIPU-AI"

test:
  parse_timeout: 300
  parse_interval: 5
  # 检索参数优化：
  # - top_k: 从 6 增加到 15，提高召回更多候选 chunk 的机会
  # - score_threshold: 从 0.3 降低到 0.0，移除相似度阈值限制
  #   原因：测试显示许多有效答案的相似度在 0.23-0.37 之间，
  #   过高的阈值会过滤掉有效结果
  # 注意：retrieval.py 使用 score_threshold，但 API 期望 similarity_threshold
  # 如果参数名不匹配，API 会使用默认值 0.2
  top_k: 15
  score_threshold: 0.0

documents:
  - name: "曾庆成危险驾驶案"
    doc_type: "indictment"
    path: "benchmark/起诉意见书/曾庆成危险驾驶案/原始数据/起诉意见书_sample.pdf"
    question_dir: "benchmark/起诉意见书/曾庆成危险驾驶案"
  - name: "陈明飞诈骗案"
    doc_type: "interrogation"
    path: "benchmark/讯问笔录/陈明飞诈骗案/原始数据/讯问笔录_sample.pdf"
    question_dir: "benchmark/讯问笔录/陈明飞诈骗案"

# 答案匹配配置
matching:
  factual:
    # 事实型题目：标准化后包含匹配
    normalize_whitespace: true
    case_sensitive: false
  evidence:
    # 证据集合型：覆盖率阈值 (降低以适应 LLM 摘要式回答)
    coverage_threshold: 0.5
  gap:
    # 冲突缺口型：否定关键词 (扩展以覆盖更多表达方式，包括英文)
    negative_keywords:
      # 中文关键词
      - "材料未显示"
      - "文档未提及"
      - "无法确定"
      - "未记载"
      - "没有信息"
      - "未找到"
      - "无法从材料中得知"
      - "材料中没有"
      - "未提供"
      - "没有明确提及"
      - "未在文档中"
      - "文档中没有"
      - "没有在文档中提及"
      - "未知"
      - "不明确"
      - "没有相关信息"
      - "信息不详"
      - "未提及"
      - "不清楚"
      - "无法确认"
      - "没有记载"
      - "不详"
      - "忘记了"
      - "忘记"
      - "不提供"
      - "没有列出"
      # 英文关键词 (LLM 可能返回英文)
      - "not found"
      - "no relevant content"
      - "not in the dataset"
      - "not provided"
      - "does not contain"
      - "not available"
      - "unable to"
      - "cannot find"
      - "sorry"
      - "does not provide"
