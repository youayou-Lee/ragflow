# 刑事案件 RAG Benchmark 测试配置

server:
  base_url: "http://127.0.0.1:9380"
  api_version: "v1"

auth:
  email: "qa@infiniflow.org"
  # password 是 "123" 加密后的值
  password: ""

dataset:
  name_prefix: "criminal_benchmark"
  embedding_model: "embedding-3@ZHIPU-AI"
  chunk_method: "naive"

chat:
  llm_model: "glm-4-flash@ZHIPU-AI"

test:
  parse_timeout: 300
  parse_interval: 5
  top_k: 10
  score_threshold: 0.0

documents:
  - name: "曾庆成危险驾驶案"
    doc_type: "indictment"
    path: "benchmark/起诉意见书/曾庆成危险驾驶案/原始数据/起诉意见书_sample.pdf"
    question_dir: "benchmark/起诉意见书/曾庆成危险驾驶案"
  - name: "陈明飞诈骗案"
    doc_type: "interrogation"
    path: "benchmark/讯问笔录/陈明飞诈骗案/原始数据/讯问笔录_sample.pdf"
    question_dir: "benchmark/讯问笔录/陈明飞诈骗案"

# 答案匹配配置
matching:
  factual:
    # 事实型题目：标准化后包含匹配
    normalize_whitespace: true
    case_sensitive: false
  evidence:
    # 证据集合型：覆盖率阈值
    coverage_threshold: 0.8
  gap:
    # 冲突缺口型：否定关键词
    negative_keywords:
      - "材料未显示"
      - "文档未提及"
      - "无法确定"
      - "未记载"
      - "没有信息"
      - "未找到"
      - "无法从材料中得知"
      - "材料中没有"
      - "未提供"
